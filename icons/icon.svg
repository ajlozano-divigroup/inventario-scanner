<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(96,96)" stroke="white" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- QR-like squares -->
    <rect x="0" y="0" width="110" height="110" rx="20"/>
    <rect x="210" y="0" width="110" height="110" rx="20"/>
    <rect x="0" y="210" width="110" height="110" rx="20"/>
    <!-- Filled square bottom-right -->
    <rect x="230" y="230" width="90" height="90" rx="15" fill="white" stroke="none"/>
    <!-- Center dots -->
    <circle cx="55" cy="55" r="22" fill="white" stroke="none"/>
    <circle cx="265" cy="55" r="22" fill="white" stroke="none"/>
    <circle cx="55" cy="265" r="22" fill="white" stroke="none"/>
    <!-- Scan line -->
    <line x1="0" y1="160" x2="320" y2="160" stroke="white" stroke-width="8" opacity="0.6"/>
  </g>
</svg>
